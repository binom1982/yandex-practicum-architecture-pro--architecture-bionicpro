services:
  # ─────────────────────────────────────────────────────
  # Keycloak + PostgreSQL
  # ─────────────────────────────────────────────────────
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HEALTH_ENABLED: "true"
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy
    healthcheck:
      # Проверка доступности порта без внешних утилит
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s  # Keycloak в dev-режиме запускается долго

  # ─────────────────────────────────────────────────────
  # Redis для сессий bionicpro-auth
  # ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─────────────────────────────────────────────────────
  # bionicpro-auth-service
  # ─────────────────────────────────────────────────────
  bionicpro-auth:
    build:
      context: ./services/bionicpro-auth-service
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      # Keycloak
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__Realm: reports-realm
      Keycloak__ClientId: reports-api
      Keycloak__ClientSecret: oNwoLQdvJAvRcL89SydqCWCe5ry1jMgq
      
      # Redis
      Redis__ConnectionString: redis:6379
      
      # Сессии
      Session__CookieName: bionicpro_session
      Session__SessionLifetimeMinutes: 60
      Session__AccessTokenLifetimeMinutes: 2
      
      # ASP.NET Core
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s  # Увеличено для инициализации .NET + подключений

  # ─────────────────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # API теперь идёт через bionicpro-auth, а не напрямую в reports-api
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
    depends_on:
      bionicpro-auth:
        condition: service_healthy

  # ─────────────────────────────────────────────────────
  # LDAP (обновлено)
  # ─────────────────────────────────────────────────────
  openldap:
    image: osixia/openldap:1.5.0  # стабильная версия с Docker Hub [[22]]
    container_name: bionicpro-ldap
    ports:
      - "1389:389"   # исправлен порт: внутренний 389, не 1389
      - "1636:636"
    environment:
      - LDAP_ORGANISATION=BionicPRO
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=adminpassword
      - LDAP_CONFIG_PASSWORD=configpassword
      - LDAP_TLS=false
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif:ro
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    command: ["--copy-service"]  # важно для применения LDIF при старте
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-b", "dc=example,dc=com", "-D", "cn=admin,dc=example,dc=com", "-w", "adminpassword", "objectClass=*"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0  # совместимая версия [[11]]
    container_name: bionicpro-ldap-admin
    ports:
      - "6443:80"  # HTTP, т.к. PHPLDAPADMIN_HTTPS=false
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=false
    depends_on:
      openldap:
        condition: service_healthy

volumes:
  ldap_data:
  ldap_config:
