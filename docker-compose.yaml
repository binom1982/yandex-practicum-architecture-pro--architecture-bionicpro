services:
  # ─────────────────────────────────────────────────────
  # Keycloak + PostgreSQL
  # ─────────────────────────────────────────────────────
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 300s  # 5 минут на инициализацию
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HEALTH_ENABLED: "true"
      # Добавьте настройки пула соединений:
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_DB_SCHEMA: public
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      # Проверка доступности порта без внешних утилит
      test: ["CMD-SHELL", "/opt/keycloak/bin/kc.sh show-config > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s  # Keycloak в dev-режиме запускается долго

  # ─────────────────────────────────────────────────────
  # bionicpro-auth-service
  # ─────────────────────────────────────────────────────
  bionicpro-auth:
    build:
      context: ./services/bionicpro-auth-service
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      # Keycloak
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__Realm: reports-realm
      Keycloak__ClientId: reports-api
      Keycloak__ClientSecret: oNwoLQdvJAvRcL89SydqCWCe5ry1jMgq
    
      # Сессии
      Session__CookieName: bionicpro_session
      Session__SessionLifetimeMinutes: 60
      Session__AccessTokenLifetimeMinutes: 2
      
      # ASP.NET Core
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s  # Увеличено для инициализации .NET + подключений

  # ─────────────────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_AUTH_URL: http://localhost:8000
      REACT_APP_REPORTS_URL: http://localhost:5001

      # API теперь идёт через bionicpro-auth, а не напрямую в reports-api
      # REACT_APP_API_URL: http://localhost:8000
      # REACT_APP_KEYCLOAK_URL: http://localhost:8080
      # REACT_APP_KEYCLOAK_REALM: reports-realm
      # REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
    depends_on:
      bionicpro-auth:
        condition: service_healthy

  # ─────────────────────────────────────────────────────
  # Задание 1.: LDAP
  # ─────────────────────────────────────────────────────
  openldap:
    image: osixia/openldap:1.5.0  # стабильная версия с Docker Hub [[22]]
    container_name: bionicpro-ldap
    ports:
      - "1389:389"   # исправлен порт: внутренний 389, не 1389
      - "1636:636"
    environment:
      - LDAP_ORGANISATION=BionicPRO
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=adminpassword
      - LDAP_CONFIG_PASSWORD=configpassword
      - LDAP_TLS=false
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif:ro
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    command: ["--copy-service"]  # важно для применения LDIF при старте
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-b", "dc=example,dc=com", "-D", "cn=admin,dc=example,dc=com", "-w", "adminpassword", "objectClass=*"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0  # совместимая версия [[11]]
    container_name: bionicpro-ldap-admin
    ports:
      - "6443:80"  # HTTP, т.к. PHPLDAPADMIN_HTTPS=false
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=false
    depends_on:
      openldap:
        condition: service_healthy

  # ─────────────────────────────────────────────────────
  # Задание 2: OLAP
  # ─────────────────────────────────────────────────────
  x-airflow-common: &airflow-common
    image: apache/airflow:2.8.1
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: 'ZmDqFC3hYp4K7s2V9x1W8e6RtYuI0oP-aBcDeFgHiJk='
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      airflow-postgres:
        condition: service_started #service_healthy
 
  # === ClickHouse OLAP ===
  clickhouse:
    image: clickhouse/clickhouse-server:23.12
    container_name: bionicpro-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    environment:
      CLICKHOUSE_DB: reports_db
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Airflow metadata DB ===
  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  # === Airflow init (create user + migrate DB) ===
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@bionicpro.local

  # === Airflow Webserver ===
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # === Airflow Scheduler ===
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler

  # === Reports API (bionicpro-reports) ===
  bionicpro-reports:
    build: ./services/bionicpro-reports
    container_name: bionicpro-reports
    ports:
      - "5001:8080"
    environment:
      CLICKHOUSE_CONN: "Host=clickhouse;Port=8123;Database=reports_db;Username=default;Password="
      AUTH_SERVICE_URL: "http://bionicpro-auth:8080"
      SESSION_COOKIE_NAME: "session_id"
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  ldap_data:
  ldap_config:
  clickhouse-data:
  airflow-pg-data:
