name: bionicpro

# ─────────────────────────────────────────────────────
# YAML-якорь для переиспользования (на корневом уровне)
# ─────────────────────────────────────────────────────
x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: 'ZmDqFC3hYp4K7s2V9x1W8e6RtYuI0oP-aBcDeFgHiJk='
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-clickhouse>=0.4.0"  # ← добавить
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/requirements.txt:/requirements.txt  # ← добавить
  depends_on:
    airflow-postgres:
      condition: service_healthy
  restart: on-failure

# ─────────────────────────────────────────────────────
# Сервисы
# ─────────────────────────────────────────────────────
services:
  # ─────────────────────────────────────────────────────
  # Keycloak + PostgreSQL
  # ─────────────────────────────────────────────────────
  keycloak-db:  # ← тире вместо подчёркивания
    image: postgres:14
    # container_name удалён — имя будет bionicpro-keycloak-db-1
    environment:
      POSTGRES_DB: keycloak_db  # ← имя БД внутри PostgreSQL (оставляем подчёркивание)
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak-pg-data:/var/lib/postgresql/data  # ← тире в имени volume
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 300s

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_db  # ← ссылается на сервис keycloak-db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HEALTH_ENABLED: "true"
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_DB_SCHEMA: public
      KC_IMPORT_STRATEGY: OVERWRITE_EXISTING
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:  # ← обновлена ссылка
        condition: service_healthy
    restart: on-failure
    # healthcheck:
    #   disable: true  # ← только для dev!
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]  # ← проще: проверяем корень
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 300s

  # ─────────────────────────────────────────────────────
  # Auth service
  # ─────────────────────────────────────────────────────
  bionicpro-auth:
    build:
      context: ./services/bionicpro-auth-service
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__Realm: reports-realm
      Keycloak__ClientId: reports-api
      Keycloak__ClientSecret: oNwoLQdvJAvRcL89SydqCWCe5ry1jMgq
      Session__CookieName: bionicpro_session
      Session__SessionLifetimeMinutes: 60
      Session__AccessTokenLifetimeMinutes: 2
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      keycloak:
        condition: service_started # service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_AUTH_URL: http://localhost:8000
      REACT_APP_REPORTS_URL: http://localhost:5001
    depends_on:
      bionicpro-auth:
        condition: service_healthy

  # ─────────────────────────────────────────────────────
  # LDAP
  # ─────────────────────────────────────────────────────
  openldap:
    image: osixia/openldap:1.5.0
    ports:
      - "1389:389"
      - "1636:636"
    environment:
      - LDAP_ORGANISATION=BionicPRO
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=adminpassword
      - LDAP_CONFIG_PASSWORD=configpassword
      - LDAP_TLS=false
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif:ro
      - ldap-data:/var/lib/ldap  # ← тире
      - ldap-config:/etc/ldap/slapd.d  # ← тире
    command: ["--copy-service"]
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-b", "dc=example,dc=com", "-D", "cn=admin,dc=example,dc=com", "-w", "adminpassword", "objectClass=*"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    ports:
      - "6443:80"
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=false
    depends_on:
      openldap:
        condition: service_healthy

  # ─────────────────────────────────────────────────────
  # OLAP
  # ─────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:23.12
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: reports_db  # ← имя БД внутри ClickHouse (подчёркивание)
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-postgres:  # ← уже с тире, оставляем
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@bionicpro.local

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  # ─────────────────────────────────────────────────────
  # Reports API
  # ─────────────────────────────────────────────────────
  bionicpro-reports:
    build: ./services/bionicpro-reports
    ports:
      - "5001:8080"
    environment:
      CLICKHOUSE_CONN: "Host=clickhouse;Port=8123;Database=reports_db;Username=default;Password="
      AUTH_SERVICE_URL: "http://bionicpro-auth:8080"
      SESSION_COOKIE_NAME: "session_id"
    depends_on:
      clickhouse:
        condition: service_healthy

# ─────────────────────────────────────────────────────
# Volumes (все с тире)
# ─────────────────────────────────────────────────────
volumes:
  keycloak-pg-data:
  ldap-data:
  ldap-config:
  clickhouse-data:
  airflow-pg-data: