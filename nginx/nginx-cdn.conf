# Кеш-зона: 10MB для ключей, до 1GB данных, удаление неактивных файлов через 24ч
proxy_cache_path /var/cache/nginx
    levels=1:2
    keys_zone=cdn_cache:10m
    max_size=1g
    inactive=24h
    use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Health check для Docker
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Проксирование отчётов из MinIO с кешированием
    location /reports/ {
        proxy_pass http://minio:9000/reports/;
        
        # Заголовки для MinIO
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Кеш
        proxy_cache cdn_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        
        # Заголовки ответа
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=86400";
        
        # CORS (если нужно для фронтенда)
        add_header Access-Control-Allow-Origin *;
    }

    # Блокировка доступа к другим путям MinIO
    location / {
        return 403;
    }
}